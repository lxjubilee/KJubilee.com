<style>
/* ==========================================================================
   kJubilee.com — the full dial, one station per row.
   Shares the home page's tokens and top bar so this reads as the same site;
   the only new vocabulary here is the row grid below.
   ========================================================================== */
:root{
  --bg:#000;
  --surface:#14151d;
  --surface-2:#16171f;
  --card:#2d2d2d;
  --card-hover:#3a3a3a;
  --text:#f3f2ee;
  --text-dim:#c9cad4;
  --text-muted:#8c8d9c;
  --accent:#3DA5FF;
  /* ON AIR is green everywhere, independent of the site accent. Green means
     live; it is the one colour on the page that carries a meaning of its own
     rather than a brand. */
  --onair:#46D07A;
  --onair-ink:#05210f;
  --accent-hi:#7CC4FF;
  --accent-lo:#1B6FB8;
  --border:hsla(0,0%,100%,.06);
  --border-strong:hsla(0,0%,100%,.1);
  --font-sans:"Segoe UI",Tahoma,Geneva,Verdana,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-logo:"Orbitron","Segoe UI",sans-serif;
  --topbar-row1-h:48px;
  --topbar-row2-h:50px;
  --site-max:1548px;
  --site-pad:10px;
  /* One track list drives both the header and every row, so a column can
     never drift out of alignment with its own heading. */
  --cols:112px 54px minmax(170px,2fr) 68px minmax(115px,.9fr) minmax(100px,.75fr) minmax(205px,1.6fr) minmax(112px,.85fr) 88px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- top bar (matches index.html) --------------------------------- */
.topbar{flex:none;background:#1b1b1b;border-bottom:1px solid var(--border-strong);z-index:30}
.topbar-row1,.topbar-row2{
  display:flex;align-items:center;flex-wrap:nowrap;gap:12px;
  padding:0 max(10px,calc((100% - var(--site-max)) / 2 + 10px));
}
.topbar-row1{height:var(--topbar-row1-h);background:#242424}
.topbar-row2{height:var(--topbar-row2-h);background:#1b1b1b;border-top:1px solid var(--border-strong)}
.logo{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.logo-img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.logo-name{font-family:var(--font-logo);font-weight:600;font-size:24px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.logo-accent{color:var(--accent)}
/* The leading "k" sits 2pt below the rest of the wordmark. calc with an
   absolute pt, not an em ratio, so the reduction stays exactly 2pt at the
   24px desktop size and the 17px narrow-screen size alike. */
.logo-k{font-size:calc(1em - 2pt)}
.spacer{flex:1 1 auto;min-width:0}
.nav-textlink{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  font-size:12px;font-weight:500;color:#c4c4c4;white-space:nowrap;transition:color .2s ease;
}
.nav-textlink:hover{color:#fff}
.nav-textlink.is-here{color:var(--accent)}
.searchbar{
  display:flex;align-items:center;gap:8px;flex:0 50 auto;min-width:0;
  padding:5px 12px;background:hsla(0,0%,100%,.06);
  border:1px solid hsla(0,0%,100%,.12);border-radius:4px;transition:border-color .15s ease;
}
.searchbar:focus-within{border-color:var(--accent)}
.search-icon{flex:none;color:var(--text-muted)}
.searchbar input{
  flex:1 1 auto;min-width:0;background:none;border:0;outline:0;
  color:var(--text);font:inherit;font-size:13px;
}
.searchbar input::placeholder{color:var(--text-muted)}
.btn-outline{
  padding:8px 12px;border-radius:4px;border:1px solid var(--border-strong);
  color:#c4c4c4;font-size:12px;font-weight:500;white-space:nowrap;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.btn-outline:hover{color:#fff;background:#2d2d2d}
.primary-nav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.primary-nav::-webkit-scrollbar{display:none}
.nav-link{
  padding:7px 12px;border-radius:4px;border:1px solid transparent;
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:#c4c4c4;white-space:nowrap;transition:background .2s ease,color .2s ease;
}
.nav-link:hover{background:#2d2d2d}
.nav-link.is-active{color:var(--accent);border-color:var(--accent);background:transparent}
/* Lifted from index.html so the second row matches the rest of the site. */
.search-btn{flex:none;padding:3px 10px;border-radius:3px;background:var(--accent);color:#0A1B2B;font-size:11px;font-weight:700;transition:filter .15s ease}
.search-btn:hover{filter:brightness(1.06)}
.nav-right{flex:0 0 auto;overflow:visible}
.nav-short{display:none}
@media (max-width:900px){
  .nav-long{display:none}
  .nav-short{display:inline}
}
.lang-flag{flex:0 0 auto;padding:4px 4px 4px 10px;background:#1b1b1b;display:inline-flex;transition:box-shadow .2s ease,transform .2s ease}
.lang-flag:hover{transform:scale(1.1);box-shadow:0 0 0 2px var(--accent)}
.lang-flag img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.count-chip{
  flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);white-space:nowrap;
}
.count-chip b{color:var(--accent);font-weight:700}

/* ---------- page body ---------------------------------------------------- */
.scroll{flex:1 1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.scroll-inner{
  flex:1 0 auto;
  padding:26px max(var(--site-pad),calc((100% - var(--site-max)) / 2 + var(--site-pad))) 48px;
}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.page-sub{font-size:13px;color:var(--text-muted);margin:0 0 3px}

/* The list is a real table so it stays readable to screen readers and to
   anyone who copies it out; the grid is applied to rows, not to the table. */
.dial{width:100%;border-collapse:collapse;display:block}
.dial thead,.dial tbody{display:block}
.dial tr{
  display:grid;grid-template-columns:var(--cols);align-items:center;
  gap:14px;padding:0 12px;
}
.dial thead tr{
  position:sticky;top:0;z-index:5;height:38px;
  background:#101018;border-bottom:1px solid var(--border-strong);
}
.dial th{
  text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-muted);padding:0;
}
.dial tbody tr{
  height:62px;border-bottom:1px solid var(--border);
  transition:background .15s ease;cursor:pointer;
}
.dial tbody tr:hover{background:#15161d}
.dial tbody tr:focus-visible{background:#15161d;outline:2px solid var(--accent);outline-offset:-2px}
.dial td{padding:0;min-width:0}

.hm{
  /* 20.5px, down from 22.5. The two pixels came off the dial number and the
     station name together to buy width for the Broadcasting from column —
     both are set in the wordmark face at a size that still dominates the row,
     so the hierarchy is unchanged and the row is 20px narrower on the left. */
  font-family:var(--font-logo);font-size:20.5px;font-weight:600;
  letter-spacing:.02em;color:var(--text);white-space:nowrap;
  /* Air between the dial number and the picture. The grid gap alone put them
     close enough to read as one object; they are two. */
  padding-right:14px;
}
/* The "HM" prefix scales with the number rather than staying put — it reads as
   one identifier, and leaving it behind would make the row look mismatched. */
.hm span{color:var(--text-muted);font-size:13.5px;margin-right:6px;letter-spacing:.08em}
/* THE STATION'S OWN PICTURE, at row size. The two-stop ident stays underneath
   as the ground: a station whose artwork has not been generated yet, or whose
   file 404s, shows its ident rather than a hole. Anchored to the top for the
   same reason the cards are — these renders are 16:9 with a face near the top,
   and a square crop taken from the middle decapitates every one of them. */
/* 20px before the picture, on top of the padding the frequency already
   carries. The dial number and the artwork are two things and were reading as
   one. The swatch track in --cols carries the same 10px this padding last
   gained, so the picture keeps its 44px instead of spilling into the gap. */
/* The picture sits hard against the station name rather than floating in
   the middle of its track: the ident and the title read as one object,
   and the gap that used to sit between them now sits before the
   frequency, where it separates two things that ARE separate. */
.col-swatch{padding-left:20px;display:flex;justify-content:flex-end}
.swatch{
  position:relative;width:44px;height:44px;border-radius:6px;
  border:1px solid var(--border-strong);overflow:hidden;flex:none;
}
.swatch img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center top;
  opacity:0;transition:opacity .3s ease;
}
.swatch img.on{opacity:1}
/* The station name matches its frequency: same face, same size. The two are
   the row's identity and were reading as a caption beside a headline. */
.name{
  /* 20.5px, down from 22.5 — see .hm. Dropping the name is what actually buys
     the room, since this is the widest flexible track in the row. */
  font-family:var(--font-logo);font-size:20.5px;font-weight:600;letter-spacing:.01em;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blurb{
  font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px;
}
.format{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;align-items:center;gap:8px;min-width:0}
.lang img{width:20px;height:14px;border-radius:2px;object-fit:cover;flex:none}
.lang span{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Where the station broadcasts from. Two lines rather than one comma-run: the
   anchor is a different kind of fact from the relays — it is the city the
   station belongs to — and stacking them says so without a legend. */
.bases{min-width:0;line-height:1.35}
.bases .anchor{
  font-size:12.5px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bases .relays{
  font-size:11px;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* A base with no HM tower under it. Marked rather than hidden — it is a real
   choice (Jerusalem carries seven stations and Cloudflare has no edge there),
   and a reader comparing two rows should be able to see which is which. */
.bases .no-tower{border-bottom:1px dotted var(--text-muted)}
.host{display:flex;align-items:center;gap:8px;min-width:0}
.host img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:#222}
.host span{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;justify-content:flex-end}
.songs{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-dim)}
.songs .dash{color:var(--text-muted)}
.onair{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:100px;
  background:rgba(0,0,0,.55);border:1px solid var(--accent);
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
}
.onair::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--onair);animation:pulse 1.8s ease-in-out infinite}
/* The badge doubles as the play control for that station. */
button.songs{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-dim)}
.songs .dash{color:var(--text-muted)}
.onair{cursor:pointer;font:inherit;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;transition:background .15s ease,color .15s ease}
button.onair:hover{background:var(--onair);color:var(--onair-ink)}
button.onair:hover::before{background:#052033}
button.onair svg{width:9px;height:9px;fill:currentColor}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.soon{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.empty{padding:48px 12px;text-align:center;color:var(--text-muted);font-size:14px}

/* ---------- sections ------------------------------------------------------ */
.section{margin-bottom:40px;scroll-margin-top:14px}
.section:last-of-type{margin-bottom:8px}
.section-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:9px;margin-bottom:2px;border-bottom:2px solid var(--accent);
}
/* The section headings take the wordmark's face. Positive tracking, because a
   squared geometric type needs air between letters where the humanist sans it
   replaces did not — at this size negative tracking closes the counters up. */
.section-title{
  font-family:var(--font-logo);font-size:19px;font-weight:600;
  letter-spacing:.03em;margin:0;color:var(--text);
}
.section-count{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.section-note{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.section[hidden]{display:none}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

.site-footer{
  flex:none;background:#07080c;color:var(--text-dim);padding:22px 24px;text-align:center;
  font-size:12px;letter-spacing:.04em;border-top:2px solid var(--accent);
}
.site-footer-inner{max-width:var(--site-max);margin:0 auto;line-height:1.8}
.site-footer strong{font-weight:700;color:var(--accent)}
.site-footer a{color:var(--accent)}
.site-footer a:hover{text-decoration:underline}

/* ---------- responsive ---------------------------------------------------
   Columns are dropped from the least identifying inward, so a row always
   keeps its frequency and its name no matter how narrow the viewport gets.
   Every breakpoint below restates --cols with exactly as many tracks as it
   leaves visible — these max-width queries stack, so the hidden set is
   cumulative and a track count that drifts would misalign the whole table.
     full    9: hm swatch station songs format lang bases host status
     <=1180  8: hm swatch station songs format lang bases status
     <=1000  7: hm swatch station songs format lang status
     <= 880  6: hm swatch station songs format status
     <= 720  4: hm station songs status
     <= 520  3: hm station status

   DJ HOST IS THE LAST FLEXIBLE COLUMN TO GO, not the first. Dropping Band
   returned 96px to the row, and it was spent on keeping the persona visible
   down to 1180 instead of 1280 — the host is who a listener tunes in for, and
   it used to disappear a full breakpoint before the language did.

   The `minmax()` FLOORS are what actually decide whether a row fits, not the
   fr shares: a grid will not shrink a track below its minimum, so once the
   floors plus the fixed tracks plus the gaps exceed the viewport the last
   column is pushed off the right edge. Every floor is tuned against the NARROW
   end of its own range — the widths that matter are 1181, 1001, 881, 721, 521. */
@media (max-width:1180px){
  :root{--cols:112px 54px minmax(150px,2fr) 64px minmax(100px,.9fr) minmax(88px,.75fr) minmax(175px,1.6fr) 88px}
  .col-host{display:none}
}
@media (max-width:1000px){
  :root{--cols:112px 54px minmax(180px,2.2fr) 68px minmax(118px,1fr) minmax(112px,.9fr) 92px}
  .col-bases{display:none}
}
@media (max-width:880px){
  :root{--cols:106px 50px minmax(170px,2.4fr) 66px minmax(115px,1fr) 92px}
  .col-lang{display:none}
}
@media (max-width:720px){
  :root{--cols:98px minmax(140px,1fr) 62px 88px}
  .col-swatch,.col-format{display:none}
}
@media (max-width:520px){
  /* Status survives here now that Band is gone. It carries the play button,
     which is the one control on the row worth keeping on a phone. */
  :root{--cols:88px minmax(104px,1fr) 84px}
  .col-songs{display:none}
  .topbar-row1{gap:8px}
  .searchbar{display:none}
  .blurb{display:none}
}
</style>
<!-- Same-document navigation, so moving between pages does not stop the
     music. MUST stay first and MUST NOT be deferred: it wraps
     addEventListener before any page script can register anything. -->
<script src="/js/kj-nav.js"></script>
</head>

<script>
(function () {
  'use strict';

  var STATIONS = (window.KJ_STATIONS || []).slice();
  var MEMBERS  = window.KJ_MEMBERS || [];
  var byMember = {};
  MEMBERS.forEach(function (m) { byMember[m.id] = m; });

  // Frequency order, low to high. `hm` is a display string ("088.70"), so it
  // has to be compared numerically - sorting the strings would break the
  // moment a frequency loses its leading zero.
  var FLAGSHIP = window.KJ_DEFAULT || '';
  STATIONS.sort(function (a, b) { return parseFloat(a.hm) - parseFloat(b.hm); });

  /* ==================================================================
     THE CATEGORIES ARE THE HOME PAGE'S CATEGORIES.

     This page used to carry its own list of four sections with its own
     membership tests, written from the same intent as the home page's
     shelves but written separately. Two hand-maintained answers to "which
     category is this station in" is one too many: they had already drifted
     (different names on each page, and mainstream had to be patched into
     both by hand), and the next station added would have drifted them again.

     So the sections now come from window.KJ_SECTIONS — the very list the
     category bar above is built from and the home page renders. Membership
     is not re-derived here at all; each shelf already names its stations, so
     a station is in this section exactly when the home page puts it there.
     Change a shelf in tools/build-home-data.js and both pages move together.

     A station may appear in TWO sections, and that is deliberate rather than
     a bug to defend against: God's Little Lambs is Bible songs for small
     children and genuinely belongs under Christian Music and under Family
     Friendly. The old strict partition could not express that.
     ================================================================== */
  var SECTIONS = (window.KJ_SECTIONS || [])
    .filter(function (sec) { return sec.shelves && sec.shelves.length; })
    .map(function (sec) {
      // Flatten the shelves into one membership list. International Stations
      // is the only multi-shelf section (Americas, Europe, ... plus the
      // prayer lines); this page lists it as a single category, so its
      // sub-shelf headings collapse away.
      var slugs = {}, count = 0;
      sec.shelves.forEach(function (sh) {
        (sh.stations || []).forEach(function (slug) {
          if (!slugs[slug]) { slugs[slug] = 1; count++; }
        });
      });
      return {
        id: sec.id,
        // `catalog` is the name for this section when it is listed as a
        // category rather than navigated to — "Christian Music", not "Home".
        title: sec.catalog || sec.label || sec.nav,
        note: sec.note || '',
        has: slugs
      };
    });

  // Down the page in the same order as the category bar.
  var ORDER = SECTIONS.map(function (sec) { return sec.id; });

  var bucket = {};
  SECTIONS.forEach(function (sec) { bucket[sec.id] = []; });
  var orphans = [];
  STATIONS.forEach(function (s) {
    var placed = 0;
    SECTIONS.forEach(function (sec) {
      if (sec.has[s.slug]) { bucket[sec.id].push(s); placed++; }
    });
    if (!placed) orphans.push(s);
  });

  /* Nothing may vanish. The old last-section-claims-everything rule was what
     guaranteed that, and driving membership from the shelves gives it up — a
     station on no shelf would simply not be drawn. The generator already
     reports that condition at build time, but this page is where a reader
     would notice it, so it gets its own heading rather than going missing. */
  if (orphans.length) {
    SECTIONS.push({ id: 'unshelved', title: 'Also on the Dial',
                    note: 'Not yet assigned to a category', has: {} });
    ORDER.push('unshelved');
    bucket['unshelved'] = orphans;
  }

  // Anything ON AIR rises to the top of its own section - a listener scanning
  // for something to play should not have to hunt down a column of
  // placeholders for the two rows that make sound. Frequency order still
  // governs within each group, so the dial reads low-to-high on both sides of
  // the split rather than becoming arbitrary.
  Object.keys(bucket).forEach(function (id) {
    bucket[id].sort(function (a, b) {
      /* The flagship leads whichever section it falls in. kJubilee Radio is
         HM 308.70 and both rules below would otherwise bury it partway down
         Christian Music, beneath stations it is the flagship of. Which
         station that is comes from window.KJ_DEFAULT — the same value the
         player opens on and the hero leads with — never from the frequency,
         which is why moving 388.70 to 308.70 did not touch this rule. */
      if (a.slug === FLAGSHIP) return -1;
      if (b.slug === FLAGSHIP) return 1;
      if (!!a.prototype !== !!b.prototype) return a.prototype ? -1 : 1;
      return parseFloat(a.hm) - parseFloat(b.hm);
    });
  });

  var query = '';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* Bumped whenever the artwork changes, because Cloudflare will happily hold a
     404 for four hours — including one caused by checking for a cover before it
     was uploaded. Keep this in step with index.html. */
  var COVER_V = '20260825a';

  /* Fade a cover in once it decodes, and drop it if it 404s so the ident
     gradient underneath shows through. Capture phase and delegated: load and
     error do not bubble, and the rows are rebuilt on every keystroke, so
     per-image handlers would be re-attached hundreds of times. */
  document.addEventListener('load', function (e) {
    var img = e.target;
    if (img.tagName === 'IMG' && img.parentNode && img.parentNode.classList.contains('swatch')) {
      img.classList.add('on');
    }
  }, true);
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (img.tagName === 'IMG' && img.parentNode && img.parentNode.classList.contains('swatch')) {
      img.remove();
    }
  }, true);

  /* The clock a base keeps, as an offset the reader can compare at a glance.
     Computed from the IANA zone rather than stored, so it stays right across a
     DST change instead of going an hour stale twice a year. */
  function utcLabel(tz) {
    try {
      var parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, timeZoneName: 'shortOffset'
      }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === 'timeZoneName') return parts[i].value;
      }
    } catch (e) { /* an engine without shortOffset just gets no label */ }
    return '';
  }

  /* Where the station broadcasts from: the anchor on top, the relays beneath.
     The tooltip carries the editorial reason for the picks plus each base's
     current clock, which is the part a programmer actually needs and the part
     a 62px row has no space to print. */
  function basesHTML(s) {
    var list = s.bases || [];
    if (!list.length) return '<span class="relays">—</span>';

    var tip = list.map(function (b) {
      var off = utcLabel(b.tz);
      return b.city + ', ' + b.cc + (off ? ' (' + off + ')' : '')
        + (b.tower ? '' : ' — no HM tower');
    }).join('\n');
    if (s.basesWhy) tip += '\n\n' + s.basesWhy;

    var cell = function (b) {
      return b.tower ? esc(b.city)
        : '<span class="no-tower">' + esc(b.city) + '</span>';
    };
    return '<div class="anchor" title="' + esc(tip) + '">' + cell(list[0]) + '</div>' +
      (list.length > 1
        ? '<div class="relays" title="' + esc(tip) + '">' +
            list.slice(1).map(cell).join(' &middot; ') +
          '</div>'
        : '');
  }

  function rowHTML(s) {
    var host = byMember[s.host];
    var grad = s.gradient || ['#2d2d2d', '#3a3a3a'];
    return '<tr tabindex="0" data-slug="' + esc(s.slug) + '" ' +
             'aria-label="' + esc(s.name + ', HM ' + s.hm) + '">' +
        '<td class="hm"><span>HM</span>' + esc(s.hm) + '</td>' +
        '<td class="col-swatch"><div class="swatch" style="background:linear-gradient(135deg,' +
            esc(grad[0]) + ' 0%,' + esc(grad[1]) + ' 100%)">' +
            // No inline onload/onerror: those need nested quotes inside a
            // single-quoted JS string and one bad escape takes out the whole
            // script. A delegated capture-phase listener does it once for every
            // row instead — see coverWatch below.
            '<img alt="" loading="lazy" decoding="async" src="/cdn/stations/' +
              encodeURIComponent(s.slug) + '.webp?v=' + COVER_V + '">' +
          '</div></td>' +
        '<td><div class="name">' + esc(s.name) + '</div></td>' +
        // How many songs are in rotation. Blank rather than 0 for a station with
        // no catalog yet — "0 songs" reads as a broken station, an empty cell
        // reads as one that has not been programmed.
        '<td class="songs col-songs">' +
          (s.tracks ? esc(String(s.tracks).replace(/\B(?=(\d{3})+(?!\d))/g, ',')) : '<span class="dash">—</span>') +
        '</td>' +
        '<td class="format col-format">' + esc(s.format) + '</td>' +
        '<td class="lang col-lang">' +
          (s.flag ? '<img src="https://flagcdn.com/w40/' + esc(s.flag) + '.png" alt="" loading="lazy">' : '') +
          '<span>' + esc(s.lang) + '</span>' +
        '</td>' +
        '<td class="bases col-bases">' + basesHTML(s) + '</td>' +
        '<td class="host col-host">' +
          (host ? '<img src="' + esc(host.image) + '" alt="" loading="lazy">' : '') +
          '<span>' + esc(host ? host.short : '') + '</span>' +
        '</td>' +
        '<td class="status col-status">' +
          (s.prototype
            ? '<button class="onair" data-kj-play="' + esc(s.slug) + '" title="Play ' + esc(s.name) + '">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>On air</button>'
            : '<span class="soon">Coming soon</span>') +
        '</td>' +
      '</tr>';
  }

  function headHTML() {
    return '<thead><tr>' +
        '<th scope="col">Frequency</th>' +
        '<th scope="col" class="col-swatch"><span class="sr-only">Ident</span></th>' +
        '<th scope="col">Station</th>' +
        '<th scope="col" class="col-songs" style="text-align:right">Songs</th>' +
        '<th scope="col" class="col-format">Format</th>' +
        '<th scope="col" class="col-lang">Language</th>' +
        '<th scope="col" class="col-bases">Broadcasting</th>' +
        '<th scope="col" class="col-host">DJ Host</th>' +
        '<th scope="col" class="col-status" style="text-align:right">Status</th>' +
      '</tr></thead>';
  }

  function matches(s) {
    var q = query.trim().toLowerCase();
    if (!q) return true;
    // Match the things someone actually types: a dial number, a station name,
    // its format, its language — or a city it broadcasts from, which is how
    // someone asks "what comes out of Sacramento".
    var cities = (s.bases || []).map(function (b) { return b.city; }).join(' ');
    return (s.name + ' ' + s.hm + ' ' + s.format + ' ' + s.lang + ' ' + cities)
      .toLowerCase().indexOf(q) >= 0;
  }

  function sectionHTML(sec, list) {
    return '<section class="section" id="' + sec.id + '"' + (list.length ? '' : ' hidden') + '>' +
        '<div class="section-head">' +
          '<h2 class="section-title">' + esc(sec.title) + '</h2>' +
          '<span class="section-count">' + list.length + ' station' + (list.length === 1 ? '' : 's') + '</span>' +
          '<span class="section-note">' + esc(sec.note) + '</span>' +
        '</div>' +
        '<table class="dial">' + headHTML() +
          '<tbody>' + list.map(rowHTML).join('') + '</tbody>' +
        '</table>' +
      '</section>';
  }

  function render() {
    var shown = 0;
    var html = ORDER.map(function (id) {
      var sec = SECTIONS.filter(function (x) { return x.id === id; })[0];
      var list = bucket[id].filter(matches);
      shown += list.length;
      return sectionHTML(sec, list);
    }).join('');
    document.getElementById('sections').innerHTML = html;
    document.getElementById('empty').hidden = shown > 0;
    // A search can empty the section the bar is pointing at, so the highlight
    // is re-derived from what survived rather than left on a heading that is
    // now display:none.
    syncActive();
  }

  /* THE SITE'S CATEGORY BAR, built from the same KJ_SECTIONS the home page uses
     so the row reads identically everywhere.

     Where it differs is what the links DO. On the home page they route to a
     shelf; here the same four groupings are already on the page, so they jump to
     the section instead of leaving for a page that shows less. The band
     explainer has no counterpart here and goes home.

     WHICH section a category is is no longer translated. This used to hold a
     hand-written map from nav id to on-page id (home -> 'christian-music', and
     so on) and all four of those targets had been renamed out from under it:
     sectionHTML draws each section with sec.id straight from KJ_SECTIONS, so
     every href pointed at an anchor that did not exist and the whole bar was
     dead. ORDER already lists the ids this page really rendered, so ask it
     rather than keep a second answer that can drift again.

     Same markup, same classes, same appearance — the behaviour follows the page
     rather than the page following the markup. */
  var ON_PAGE = {};
  ORDER.forEach(function (id) { ON_PAGE[id] = 1; });

  var navLinks = [];

  (function buildNav() {
    var SITE = window.KJ_SECTIONS || [];
    function navHTML(secs) {
      return secs.map(function (sec) {
        var label = sec.navShort
          ? '<span class="nav-long">' + esc(sec.nav) + '</span>' +
            '<span class="nav-short">' + esc(sec.navShort) + '</span>'
          : esc(sec.nav);
        var here = ON_PAGE[sec.id];
        var href = here ? '#' + sec.id : '/#' + sec.id;
        return '<a class="nav-link" href="' + esc(href) + '"' +
               (here ? ' data-section="' + esc(sec.id) + '"' : '') + '>' +
               label + '</a>';
      }).join('');
    }
    var left = document.getElementById('nav'), right = document.getElementById('nav-right');
    if (left) left.innerHTML = navHTML(SITE.filter(function (x) { return x.align !== 'right'; }));
    if (right) right.innerHTML = navHTML(SITE.filter(function (x) { return x.align === 'right'; }));
    navLinks = [].slice.call(document.querySelectorAll('.nav-link[data-section]'));
  })();

  /* Clicking a category lights it up and goes to it, the way the home page's
     bar does. The scroll is done by hand rather than left to the anchor: the
     list lives inside .scroll rather than in the document, arriving wants the
     same easing the home page's view change has, and a section emptied by the
     search filter is [hidden] and has nothing for the browser to land on. */
  var scroller = document.querySelector('.scroll');

  function setActive(id) {
    navLinks.forEach(function (a) {
      var on = a.getAttribute('data-section') === id;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  }

  function goToSection(id, behavior) {
    if (!id || !ON_PAGE[id] || !scroller) return false;
    var el = document.getElementById(id);
    if (!el || el.hidden) return false;
    var top = el.getBoundingClientRect().top
            - scroller.getBoundingClientRect().top
            + scroller.scrollTop
            - 14;                       // matches .section scroll-margin-top
    scroller.scrollTo({ top: Math.max(0, top), behavior: behavior || 'smooth' });
    setActive(id);
    return true;
  }

  /* The highlight follows the page as well as the click, so scrolling and the
     bar never disagree about where you are. Whichever section owns the top of
     the list wins; above the first one, the first one is still where you are. */
  function syncActive() {
    if (!scroller || !navLinks.length) return;
    var line = scroller.getBoundingClientRect().top + 24;
    var current = '', first = '', last = '';
    ORDER.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.hidden) return;
      if (!first) first = id;
      if (el.getBoundingClientRect().top <= line) current = id;
      last = id;
    });
    // At the end of the list the final section can be too short to ever reach
    // the top line, and would hand the highlight back to the one above it the
    // moment the smooth scroll settled. Scrolled to the bottom is as far as it
    // can be got to, so there it wins.
    if (last && scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) current = last;
    setActive(current || first);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.nav-link[data-section]');
    if (!a) return;
    var id = a.getAttribute('data-section');
    e.preventDefault();
    // replaceState, not location.hash: the hash is here so a category can be
    // linked and reloaded into, and assigning it makes the browser jump to the
    // anchor instantly and race the smooth scroll below. Nor should four
    // in-page jumps pile up as four presses of the Back button.
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    if (!goToSection(id)) setActive(id);
  });

  // Somebody else's hash change — Back into a category, or a pasted link.
  window.addEventListener('hashchange', function () {
    goToSection(decodeURIComponent(location.hash.slice(1)));
  });

  if (scroller) {
    var ticking = false;
    scroller.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { ticking = false; syncActive(); });
    }, { passive: true });
  }

  document.getElementById('qbtn').addEventListener('click', function () {
    query = document.getElementById('q').value;
    render();
  });

  document.getElementById('q').addEventListener('input', function () {
    query = this.value;
    render();
  });

  // Delegated from the container, because the sections are re-rendered on
  // every keystroke.
  //
  // An ON AIR station plays in the footer bar rather than navigating away: the
  // bar follows the listener across the site, and the station is delivered from
  // its own published day file (guidelines 2.5) rather than from a mount, so
  // there is nothing to navigate to. A station not yet on air has no
  // programming to play and still opens the player page for its detail.
  function open(slug) {
    if (!slug) return;
    if (window.kjPlayer && window.kjPlayer.isLive(slug)) { window.kjPlayer.play(slug); return; }
    location.href = '/radio?station=' + encodeURIComponent(slug);
  }
  var host = document.getElementById('sections');
  host.addEventListener('click', function (e) {
    // The On air button is handled by the footer player's own delegated
    // listener. This one runs first, being nearer the target, so without this
    // guard it would navigate out from under the audio the button just started.
    if (e.target.closest('[data-kj-play]')) return;
    var tr = e.target.closest('tr[data-slug]');
    if (tr) open(tr.getAttribute('data-slug'));
  });
  host.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.closest('[data-kj-play]')) return;  // the button raises its own click
    var tr = e.target.closest('tr[data-slug]');
    if (!tr) return;
    e.preventDefault();
    open(tr.getAttribute('data-slug'));
  });

  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('stat').textContent =
    STATIONS.length + ' stations · HM ' + STATIONS[0].hm + ' – HM ' + STATIONS[STATIONS.length - 1].hm;

  render();

  /* Arriving on /stations.html#kids should open on Family Friendly. 'auto', not
     smooth: easing a page you have only just opened reads as a glitch. */
  if (!goToSection(decodeURIComponent(location.hash.slice(1)), 'auto')) syncActive();
})();
</script>
<script>window.KJNav && window.KJNav.pageDone();</script>  <!-- closes the window in which registrations count as this page's; see js/kj-nav.js. The footer player loads after this. -->
</body>
</html>
