<link rel="icon" href="/images/members/JubileeInspire-Circle-200.png" type="image/png">
<link rel="apple-touch-icon" href="/images/members/JubileeInspire-Circle-200.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================================
   kJubilee.com — HM AI Radio Towers Worldwide.

   The dial is delivered from the edge, so this is a map of transmitters: every
   city that carries the signal. Instrument-panel blue with gold markers, which
   is a different vocabulary from the rest of the site on purpose — this page is
   infrastructure, not programming.
   ========================================================================== */
:root{
  --bg:#070b14;
  --panel:#0c1424;
  --border:#1b2c47;
  --border-strong:#24405f;
  --text:#eef3fb;
  --text-dim:#a8bad4;
  --text-muted:#6f88a8;
  --accent:#3DA5FF;
  --gold:#f5c451;
  --gold-dim:#b98f31;
  --sea:#050a14;
  --land:#10233d;
  --land-hi:#183255;
  --coast:#2f5c8f;
  --site-max:1720px;
  --site-pad:24px;
  --topbar-row1-h:48px;
  --topbar-row2-h:50px;
  --font-logo:"Orbitron","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- top bar ------------------------------------------------------
   LIFTED VERBATIM FROM THE HOME PAGE, down to the hex values.

   The page below it is instrument blue; the header is the site's, and the two
   are not meant to match. So the home page's own tokens are redeclared on
   .topbar itself rather than in :root — custom properties inherit, so the whole
   header subtree resolves them the way index.html does while the map keeps its
   own palette untouched. Copy any change here from index.html rather than
   inventing one, or the two headers drift. */
.topbar{
  --accent:#3DA5FF;
  --border-strong:hsla(0,0%,100%,.1);
  --site-max:1548px;
  --topbar-row1-h:48px;
  --topbar-row2-h:50px;
  --font-logo:"Orbitron","Segoe UI",sans-serif;
  flex:none;background:#1b1b1b;border-bottom:1px solid var(--border-strong);z-index:30;
}
.topbar-row1,.topbar-row2{
  display:flex;align-items:center;flex-wrap:nowrap;gap:12px;
  padding:0 max(10px,calc((100% - var(--site-max)) / 2 + 10px));
}
.topbar-row1{height:var(--topbar-row1-h);background:#242424}
.topbar-row2{height:var(--topbar-row2-h);background:#1b1b1b;border-top:1px solid var(--border-strong)}
.logo{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.logo-img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.logo-name{font-family:var(--font-logo);font-weight:600;font-size:24px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.logo-accent{color:var(--accent)}
/* The leading "k" sits 2pt below the rest of the wordmark. calc with an
   absolute pt, not an em ratio, so the reduction stays exactly 2pt at the
   24px desktop size and the 17px narrow-screen size alike. */
.logo-k{font-size:calc(1em - 2pt)}
.spacer{flex:1 1 auto;min-width:0}
.nav-textlink{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  font-size:12px;font-weight:500;color:#c4c4c4;white-space:nowrap;transition:color .2s ease;
}
.nav-textlink:hover{color:#fff}
.searchbar{
  display:flex;align-items:center;gap:8px;flex:0 50 auto;min-width:0;
  padding:5px 12px;background:hsla(0,0%,100%,.06);
  border:1px solid hsla(0,0%,100%,.12);border-radius:4px;transition:border-color .15s ease;
}
.searchbar:focus-within{border-color:hsla(0,0%,100%,.2)}
.search-icon{color:#8a8a8a;flex:none}
.searchbar input{flex:1 1;min-width:0;width:130px;background:none;border:0;color:#fff;font-size:12px;outline:none}
.searchbar input::placeholder{color:#8a8a8a}
.search-btn{flex:none;padding:3px 10px;border-radius:3px;background:var(--accent);color:#0A1B2B;font-size:11px;font-weight:700;transition:filter .15s ease}
.search-btn:hover{filter:brightness(1.06)}
.btn-outline{
  padding:8px 12px;border-radius:4px;border:1px solid var(--border-strong);
  color:#c4c4c4;font-size:12px;font-weight:500;white-space:nowrap;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.btn-outline:hover{color:#fff;background:#2d2d2d}
.primary-nav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.primary-nav::-webkit-scrollbar{display:none}
.nav-link{
  display:inline-flex;align-items:center;padding:8px 12px;border:1px solid transparent;border-radius:4px;
  font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:#fff;white-space:nowrap;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.nav-link:hover{background:#2d2d2d}
.nav-link.is-active{color:var(--accent);border-color:var(--accent);background:transparent}
.nav-right{flex:0 0 auto;overflow:visible}
.nav-short{display:none}
@media (max-width:900px){
  .nav-long{display:none}
  .nav-short{display:inline}
}
.lang-flag{flex:0 0 auto;padding:4px 4px 4px 10px;background:#1b1b1b;display:inline-flex;transition:box-shadow .2s ease,transform .2s ease}
.lang-flag:hover{transform:scale(1.1);box-shadow:0 0 0 2px var(--accent)}
.lang-flag img{width:26px;height:26px;border-radius:50%;object-fit:cover}

/* ---------- layout -------------------------------------------------------- */
main{flex:1 1;min-height:0;display:flex;overflow:hidden}
.map-wrap{flex:1 1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px var(--site-pad) 16px}
.map-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:11px;flex:none}
/* THE SAME TYPEFACE AS THE WORDMARK. Orbitron at 600, which is how the logo
   is set — the two are the only display type on the page and reading as one
   voice is the point. Positive tracking rather than the -.01em this had: a
   squared geometric face needs air between letters where a humanist sans does
   not, and at this size negative tracking closes the counters up. */
.map-head h1{
  font-family:var(--font-logo);font-weight:600;font-size:20px;letter-spacing:.03em;
  line-height:1.25;
}
.map-head h1 span{color:var(--gold)}
.map-tools{margin-left:auto;display:flex;gap:6px;flex:none}
.map-tool{
  width:34px;height:34px;border:1px solid var(--border-strong);border-radius:8px;
  display:grid;place-items:center;color:var(--text-dim);background:#0d1729;
  transition:border-color .15s ease,color .15s ease;
}
.map-tool:hover{border-color:var(--gold);color:var(--gold)}
.map-tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- the map ------------------------------------------------------- */
.kjmap{position:relative;flex:1 1;min-height:0;border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;background:var(--sea)}
.kjmap-viewport{position:absolute;inset:0}
.kjmap-svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.kjmap-svg.is-dragging{cursor:grabbing}
.kjmap-sea{fill:var(--sea)}

/* Meridians and parallels. non-scaling-stroke keeps them hairlines at 14x. */
.kjmap-grid{fill:none;stroke:#16304f;stroke-width:1;vector-effect:non-scaling-stroke}

.kjmap-country{
  fill:var(--land);stroke:var(--coast);stroke-width:1;
  vector-effect:non-scaling-stroke;transition:fill .12s ease;
}
.kjmap-country:hover{fill:var(--land-hi)}

/* MARKERS ARE HELD AT A FIXED PIXEL SIZE by layoutDots(), which writes the
   scale into each marker's own transform. Nothing here may reintroduce a
   size that depends on the map — no width in user units, no stroke that
   scales. That is the whole point: the same dot at every zoom and every
   panel size. */
.kjmap-dot{cursor:pointer}

/* THE TOWERS BREATHE. Each marker carries its own --pulse-dur and
   --pulse-delay, written by the renderer from a hash of its own name, so no two
   neighbours rise and fall together and the whole network shimmers rather than
   blinks. Only opacity is animated: 347 elements changing opacity is cheap and
   composites on the GPU, where 347 elements changing geometry would not. */
.kjmap-dot-halo{
  fill:var(--gold);opacity:.16;
  animation:kjmap-breathe var(--pulse-dur,7s) ease-in-out var(--pulse-delay,0s) infinite;
}
.kjmap-dot-core{
  fill:var(--gold);stroke:#2a1c05;stroke-width:1;opacity:.82;
  animation:kjmap-glow var(--pulse-dur,7s) ease-in-out var(--pulse-delay,0s) infinite;
}
@keyframes kjmap-breathe{0%,100%{opacity:.07}50%{opacity:.44}}
@keyframes kjmap-glow{0%,100%{opacity:.72}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .kjmap-dot-halo,.kjmap-dot-core{animation:none}
  .kjmap-dot-halo{opacity:.16}
  .kjmap-dot-core{opacity:1}
}
.kjmap-dot:hover .kjmap-dot-halo,
.kjmap-dot:focus-visible .kjmap-dot-halo{opacity:.42;animation:none}
.kjmap-dot:hover .kjmap-dot-core,
.kjmap-dot:focus-visible .kjmap-dot-core{opacity:1;animation:none}
.kjmap-dot:focus-visible{outline:none}
.kjmap-dot:focus-visible .kjmap-dot-core,
.kjmap-dot.is-on .kjmap-dot-core{fill:#fff5da;stroke:var(--gold);stroke-width:2}
.kjmap-dot.is-on .kjmap-dot-core{opacity:1;animation:none}
.kjmap-dot.is-on .kjmap-dot-halo{opacity:.55;animation:kjmap-ping 1.8s ease-out infinite}
@keyframes kjmap-ping{0%{opacity:.55}70%{opacity:.08}100%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.kjmap-dot.is-on .kjmap-dot-halo{animation:none}}

.kjmap-tip{
  position:absolute;pointer-events:none;transform:translate(14px,-50%);
  background:rgba(6,11,20,.95);border:1px solid var(--border-strong);border-radius:7px;
  padding:6px 10px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:5;
  display:flex;flex-direction:column;
}
.kjmap-tip strong{color:var(--gold);font-weight:700}
.kjmap-tip span{color:var(--text-muted)}

.map-note{flex:none;margin-top:8px;font-size:11.5px;color:var(--text-muted)}
.map-note b{color:var(--text-dim);font-weight:600}

/* ---------- the roster ---------------------------------------------------- */
.map-side{flex:0 0 300px;min-height:0;border-left:1px solid var(--border-strong);background:var(--panel);display:flex;flex-direction:column}
.side-head{flex:none;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.side-head h2{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.side-search{
  margin-top:9px;width:100%;background:#091220;border:1px solid var(--border-strong);border-radius:7px;
  padding:7px 10px;font-size:13px;color:var(--text);
}
.side-search::placeholder{color:var(--text-muted)}
.side-search:focus{outline:none;border-color:var(--gold)}
.map-list{flex:1 1;min-height:0;overflow-y:auto;padding:8px 10px 16px}
.region-head{
  font-family:var(--font-logo);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold-dim);padding:12px 8px 5px;
}
.region-head b{color:var(--text-muted);font-weight:600;font-family:system-ui,sans-serif;letter-spacing:0}
.map-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:7px 8px;border-radius:7px;transition:background .12s ease}
.map-item:hover{background:#132441}
.map-item.is-on{background:rgba(245,196,81,.14)}
.map-item img{width:20px;height:14px;border-radius:2px;object-fit:cover;flex:none}
.map-item-city{flex:1 1;min-width:0;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-item-cc{flex:none;font-family:var(--font-logo);font-size:10.5px;font-weight:600;color:var(--text-muted)}
.side-empty{padding:18px 10px;font-size:12.5px;color:var(--text-muted)}

@media (max-width:1000px){
  main{flex-direction:column;overflow-y:auto}
  .map-wrap{height:68vh;flex:none}
  .map-side{flex:none;border-left:0;border-top:1px solid var(--border-strong)}
  .map-list{overflow:visible}
}
@media (max-width:700px){
  .nav-textlink,.hm-sub{display:none}
  .map-wrap{height:56vh;padding:10px 12px 12px}
  .map-head h1{font-size:17px}
}
</style>
<!-- Same-document navigation, so moving between pages does not stop the
     music. MUST stay first and MUST NOT be deferred: it wraps
     addEventListener before any page script can register anything. -->
<script src="/js/kj-nav.js"></script>
</head>
<body>

  <div class="topbar-row1">

    </a>
    <div class="spacer"></div>
    <a class="nav-textlink" href="https://www.jubileeinspire.com" rel="noopener">Jubilee AI Bible Chat</a>
    <a class="nav-textlink" href="/player.html">The Dial</a>
    <a class="nav-textlink" href="/stations.html">HM Radio Stations</a>
    <a class="nav-textlink" href="/map.html">AI Towers Map</a>
    <div class="searchbar">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>

<main>
  <div class="map-wrap">
    <div class="map-head">
      <div>
        <h1>Heavenly Modulation (HM) — <span>AI Radio Towers Worldwide</span></h1>
      </div>
      <div class="map-tools" role="group" aria-label="Map controls">
        <button class="map-tool" id="zoomOut" title="Zoom out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="map-tool" id="zoomIn" title="Zoom in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>

    </div>

  </aside>
</main>

<script src="/js/stations-data.js"></script>
<script src="/js/kj-worldmap.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* THE HEADER IS THE HOME PAGE'S, so it has to behave like the home page's.
     Its category bar is built there from KJ_SECTIONS and routed by hash; here
     there is nothing to route to, so each one is a link back to that section of
     the home page. Same markup, same class, same look — a button that did
     nothing would be worse than a link that goes somewhere. */
  (function buildNav() {
    var SECTIONS = window.KJ_SECTIONS || [];
    function esc2(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function navHTML(secs) {
      return secs.map(function (sec) {
        var label = sec.navShort
          ? '<span class="nav-long">' + esc2(sec.nav) + '</span>' +
            '<span class="nav-short">' + esc2(sec.navShort) + '</span>'
          : esc2(sec.nav);
        return '<a class="nav-link" href="/#' + esc2(sec.id) + '">' + label + '</a>';
      }).join('');
    }
    var left = document.getElementById('nav'), right = document.getElementById('nav-right');
    if (left) left.innerHTML = navHTML(SECTIONS.filter(function (s) { return s.align !== 'right'; }));
    if (right) right.innerHTML = navHTML(SECTIONS.filter(function (s) { return s.align === 'right'; }));

    // Searching stations is something only the home page can do, so the box
    // hands the query over rather than pretending to search the map.
    var input = document.getElementById('q'), btn = document.getElementById('qbtn');
    function submit() {
      var v = (input.value || '').trim();
      if (v) location.href = '/?q=' + encodeURIComponent(v);
    }
    if (btn) btn.addEventListener('click', submit);
    if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  })();

  var listEl = document.getElementById('list');
  var noteEl = document.getElementById('note');
  var findEl = document.getElementById('find');
  var towers = [];
  var regions = [];
  var chosen = -1;
  var summary = '';

  /* Markers drawn larger than the rest, keyed "City|CC" and given as a
     multiple of the base size.

     Sacramento is the origin: where the dial is run from. It is one edge
     location among 347 as far as Cloudflare is concerned, so nothing in the
     data marks it out — the emphasis is editorial and belongs here rather than
     in the roster the build produces. */
  var EMPHASIS = { 'Sacramento|US': 3 };

  // The base marker radius, in real screen pixels. Halved from 4.5: at 347
  // markers the map was reading as dots first and geography second, which is
  // backwards for a map of where the signal is.
  var DOT_PX = 2.25;

  var map = new window.KJWorldMap(document.getElementById('map'), {
    dotPx: DOT_PX,
    onPick: function (i) { choose(i, true); },
  });

  function choose(i, fromMap) {
    chosen = i;
    map.select(i);
    var t = towers[i];
    if (t && !fromMap) map.goTo(t.lon, t.lat, Math.max(map.zoom, 4));
    paintList(findEl.value);
    // The summary line stays put; which tower is selected is already said by
    // the highlighted row and the marker's own ring, so the footer does not need
    // to be spent on it.
    if (t && summary) {
      noteEl.innerHTML = summary + ' · <b>' + esc(t.city) + ', ' + esc(t.cc) + '</b>';
    }
  }

  function paintList(filter) {
    var q = String(filter || '').trim().toLowerCase();
    var shown = towers
      .map(function (t, i) { return { t: t, i: i }; })
      .filter(function (r) {
        if (!q) return true;
        return r.t.city.toLowerCase().indexOf(q) >= 0 || r.t.cc.toLowerCase().indexOf(q) >= 0;
      });

    if (!shown.length) {
      listEl.innerHTML = '<p class="side-empty">No broadcast location matches that.</p>';
      return;
    }

    var html = '', region = null;
    shown.forEach(function (r) {
      if (r.t.region !== region) {
        region = r.t.region;
        var n = shown.filter(function (x) { return x.t.region === region; }).length;
        html += '<div class="region-head">' + esc(region) + ' <b>' + n + '</b></div>';
      }
      html += '<button type="button" class="map-item' + (r.i === chosen ? ' is-on' : '') + '" data-i="' + r.i + '">' +
        '<img src="https://flagcdn.com/w40/' + esc(r.t.cc.toLowerCase()) + '.png" alt="" loading="lazy">' +
        '<span class="map-item-city">' + esc(r.t.city) + '</span>' +
        '<span class="map-item-cc">' + esc(r.t.cc) + '</span>' +
      '</button>';
    });
    listEl.innerHTML = html;
  }

  listEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]');
    if (b) choose(Number(b.getAttribute('data-i')), false);
  });
  findEl.addEventListener('input', function () { paintList(findEl.value); });

  document.getElementById('zoomIn').addEventListener('click', function () { map.zoomBy(1.5); });
  document.getElementById('zoomOut').addEventListener('click', function () { map.zoomBy(1 / 1.5); });
  document.getElementById('zoomReset').addEventListener('click', function () { map.reset(); });

  function load(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status);
      return r.json();
    });
  }

  /* COARSE FIRST, THEN FINE. The 110m outline is on screen in one round trip
     and the towers go on immediately after, so the page is useful before the
     detailed borders arrive. Loading only the fine set leaves the panel empty
     for as long as it takes, which on a phone looks broken. */
  load('/data/world-110m.json')
    .then(function (world) {
      map.drawCountries(world.countries);
      map.apply();
      return load('/data/hm-towers.json');
    })
    .then(function (doc) {
      towers = doc.towers;
      regions = doc.regions;
      map.drawDots(towers.map(function (t) {
        var mult = EMPHASIS[t.city + '|' + t.cc];
        return {
          lon: t.lon, lat: t.lat,
          label: t.city + ', ' + t.cc,
          sub: t.region,
          px: mult ? DOT_PX * mult : 0,
        };
      }));
      paintList('');
      // The counts are read from the roster rather than typed, so the line
      // cannot fall out of step with the map above it when towers are added.
      // The standfirst that used to sit under the title now leads the footer,
      // ahead of the tally. Both halves are built from the roster rather than
      // typed, so neither can fall out of step with the map above them.
      summary = towers.length + ' broadcast locations across ' + doc.countries +
        ' countries carry the whole dial. Drag to pan, scroll to zoom. ' +
        'Locations: <b>' + towers.length + '</b> AI Radio Towers · <b>' +
        doc.countries + '</b> Countries · <b>7.5 Billion</b> Circulation';
      noteEl.innerHTML = summary;
      // Only now — the map is usable, so the big file can take its time.
      return load('/data/world-50m.json');
    })
    .then(function (fine) {
      map.drawCountries(fine.countries);
      map.apply();
    })
    .catch(function (err) {
      // Whatever already drew stays on screen, which is why the order matters:
      // a failed fine layer still leaves a working map and a full roster.
      noteEl.textContent = 'Map data: ' + err.message;
    });
})();
</script>
<script>window.KJNav && window.KJNav.pageDone();</script>  <!-- closes the window in which registrations count as this page's; see js/kj-nav.js. The footer player loads after this. -->
