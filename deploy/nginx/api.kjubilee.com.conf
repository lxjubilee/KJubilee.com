# ─────────────────────────────────────────────────────────────────────────
# api.kjubilee.com — the auth API on its own hostname.
#
# DNS already exists and is Cloudflare-proxied (A -> 104.21.42.220 /
# 172.67.210.109, same as kjubilee.com). What was missing is this server
# block: without a `server_name api.kjubilee.com`, nginx hands the request to
# the default server, which does not know the host, and Cloudflare reports 502.
#
# TLS terminates at Cloudflare and the origin stays on HTTP, exactly as the
# apex does (docs/DEPLOYMENT.md §7). Keep Cloudflare's SSL mode consistent with
# whatever kjubilee.com already uses — a Full (strict) zone needs an origin
# certificate here too, not plain :80.
#
#   sudo cp deploy/nginx/api.kjubilee.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.kjubilee.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api.kjubilee.com;

    # Cloudflare sends the visitor's address in CF-Connecting-IP. The app trusts
    # the FIRST hop of X-Forwarded-For (trust proxy 1), and both the rate limiter
    # and Turnstile's remoteip check read it — so getting this wrong makes every
    # visitor share one bucket.
    real_ip_header CF-Connecting-IP;
    # set_real_ip_from <cloudflare ranges>;   # see https://www.cloudflare.com/ips/

    # An auth API answers nothing that may ever be cached.
    add_header Cache-Control "no-store" always;

    # This host exposes the API surface and NOTHING else. A request for a page
    # gets 404 here rather than a second, half-working copy of the site on a
    # hostname nobody designed for it.
    location /api/ {
        proxy_pass         http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;

        # CORS is answered by the app (middleware.js), which holds the allowlist.
        # Do NOT add_header Access-Control-* here: nginx's add_header would sit
        # alongside the app's and browsers reject a duplicated
        # Access-Control-Allow-Origin outright.

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Liveness, so the host can be monitored separately from the apex.
    location = /health {
        proxy_pass       http://127.0.0.1:3210/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    location / {
        return 404 '{"error":"Not found. This host serves the API only — the site is at https://kjubilee.com"}';
        default_type application/json;
    }
}
